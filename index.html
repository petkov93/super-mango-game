<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070912" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Mango — Night Runner</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05060b;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  #game { position: fixed; inset: 0; }
  canvas { display: block; }

  /* Portrait phones get a rotate hint instead of a squashed game */
  #rotate { display: none; }
  /* Only real touch phones get the hint; desktop/preview windows still play */
  @media (orientation: portrait) and (max-width: 820px) and (hover: none) and (pointer: coarse) {
    #rotate {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #070912;
      color: #eae6dc;
      font: 600 20px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      text-align: center;
      padding: 24px;
    }
    #rotate .arrow { font-size: 52px; line-height: 1; color: #ffd98a; }
    #rotate small { font-weight: 400; font-size: 15px; opacity: 0.6; }
  }
</style>
</head>
<body>
  <div id="game"></div>

  <div id="rotate">
    <div class="arrow">↻</div>
    <div>Rotate your phone</div>
    <small>Mango runs in landscape</small>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
